<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Focus circle -->
  <circle cx="200" cy="150" r="100" fill="#fff3e0" opacity="0.7"/>
  
  <!-- Document base -->
  <rect x="120" y="80" width="160" height="140" fill="white" stroke="#5d4037" stroke-width="2" rx="5" ry="5"/>
  
  <!-- Document lines -->
  <line x1="140" y1="105" x2="260" y2="105" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="140" y1="125" x2="260" y2="125" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="140" y1="145" x2="260" y2="145" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="140" y1="165" x2="260" y2="165" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="140" y1="185" x2="260" y2="185" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="140" y1="205" x2="220" y2="205" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Headline and text elements -->
  <text x="140" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#ff6f00">Compelling Headline</text>
  <rect x="140" y="110" width="80" height="5" fill="#ff6f00" opacity="0.2" rx="2" ry="2"/>
  
  <rect x="140" y="130" width="110" height="5" fill="#5d4037" opacity="0.7" rx="2" ry="2"/>
  <rect x="140" y="140" width="100" height="5" fill="#5d4037" opacity="0.7" rx="2" ry="2"/>
  
  <rect x="140" y="150" width="115" height="5" fill="#5d4037" opacity="0.7" rx="2" ry="2"/>
  <rect x="140" y="160" width="105" height="5" fill="#5d4037" opacity="0.7" rx="2" ry="2"/>
  
  <rect x="140" y="170" width="110" height="5" fill="#5d4037" opacity="0.7" rx="2" ry="2"/>
  <rect x="140" y="180" width="95" height="5" fill="#5d4037" opacity="0.7" rx="2" ry="2"/>
  
  <rect x="140" y="190" width="80" height="5" fill="#ff6f00" opacity="0.8" rx="2" ry="2"/>
  <rect x="140" y="200" width="60" height="5" fill="#ff6f00" opacity="0.8" rx="2" ry="2"/>
  
  <!-- Pen/cursor -->
  <line x1="230" y1="190" x2="250" y2="190" stroke="#ff6f00" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="190" x2="250" y2="200" stroke="#ff6f00" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="200" r="1.5" fill="#ff6f00"/>
  
  <!-- Ideas/inspiration -->
  <circle cx="80" cy="100" r="15" fill="#ffa000" opacity="0.8"/>
  <text x="80" y="105" font-family="Arial" font-size="18" fill="white" text-anchor="middle">?</text>
  
  <circle cx="70" cy="145" r="12" fill="#ffa000" opacity="0.8"/>
  <text x="70" y="150" font-family="Arial" font-size="14" fill="white" text-anchor="middle">!</text>
  
  <circle cx="85" cy="180" r="10" fill="#ffa000" opacity="0.8"/>
  <text x="85" y="184" font-family="Arial" font-size="12" fill="white" text-anchor="middle">?</text>
  
  <!-- Keywords/SEO elements -->
  <rect x="310" y="90" width="50" height="20" fill="#e0f7fa" stroke="#00acc1" stroke-width="1" rx="10" ry="10"/>
  <text x="335" y="105" font-family="Arial" font-size="10" fill="#00acc1" text-anchor="middle">keyword</text>
  
  <rect x="320" y="120" width="50" height="20" fill="#e0f7fa" stroke="#00acc1" stroke-width="1" rx="10" ry="10"/>
  <text x="345" y="135" font-family="Arial" font-size="10" fill="#00acc1" text-anchor="middle">phrase</text>
  
  <rect x="300" y="150" width="60" height="20" fill="#e0f7fa" stroke="#00acc1" stroke-width="1" rx="10" ry="10"/>
  <text x="330" y="165" font-family="Arial" font-size="10" fill="#00acc1" text-anchor="middle">call to action</text>
  
  <!-- Connecting lines -->
  <path d="M95 100 C110 100, 110 100, 120 100" stroke="#ffa000" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
  <path d="M82 145 C100 145, 110 145, 120 145" stroke="#ffa000" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
  <path d="M95 180 C110 170, 115 170, 120 170" stroke="#ffa000" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
  
  <path d="M280 100 C290 100, 295 100, 310 100" stroke="#00acc1" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
  <path d="M280 130 C295 130, 300 130, 320 130" stroke="#00acc1" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
  <path d="M280 160 C285 160, 290 160, 300 160" stroke="#00acc1" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
  
  <!-- Title -->
  <text x="200" y="240" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#5d4037">Content Copywriter</text>
</svg>