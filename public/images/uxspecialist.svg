<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Design circle -->
  <circle cx="200" cy="150" r="100" fill="#e8eaf6" opacity="0.7"/>
  
  <!-- Wireframe/UI elements -->
  <rect x="120" y="100" width="160" height="100" fill="white" stroke="#3949ab" stroke-width="2" rx="5" ry="5"/>
  
  <!-- Header bar -->
  <rect x="120" y="100" width="160" height="20" fill="#3949ab" rx="5" ry="5"/>
  <rect x="125" y="105" width="30" height="10" fill="white" opacity="0.7" rx="2" ry="2"/>
  
  <!-- Menu items -->
  <rect x="130" y="130" width="40" height="10" fill="#e0e0e0" rx="2" ry="2"/>
  <rect x="130" y="150" width="40" height="10" fill="#e0e0e0" rx="2" ry="2"/>
  <rect x="130" y="170" width="40" height="10" fill="#e0e0e0" rx="2" ry="2"/>
  
  <!-- Content area -->
  <rect x="180" y="130" width="90" height="60" fill="#e0e0e0" rx="2" ry="2"/>
  
  <!-- Cursor/pointer -->
  <circle cx="200" cy="155" r="5" fill="#ff6d00"/>
  
  <!-- UX flow diagram -->
  <circle cx="90" cy="80" r="15" fill="#5c6bc0" opacity="0.8"/>
  <circle cx="150" cy="60" r="15" fill="#5c6bc0" opacity="0.8"/>
  <circle cx="210" cy="60" r="15" fill="#5c6bc0" opacity="0.8"/>
  <circle cx="270" cy="80" r="15" fill="#5c6bc0" opacity="0.8"/>
  
  <!-- Flow lines -->
  <line x1="105" y1="80" x2="135" y2="60" stroke="#5c6bc0" stroke-width="2"/>
  <line x1="165" y1="60" x2="195" y2="60" stroke="#5c6bc0" stroke-width="2"/>
  <line x1="225" y1="60" x2="255" y2="80" stroke="#5c6bc0" stroke-width="2"/>
  
  <!-- Person interacting -->
  <circle cx="70" cy="150" r="12" fill="#5c6bc0"/>
  <path d="M55 185 C55 165, 85 165, 85 185" fill="#5c6bc0"/>
  <line x1="70" y1="162" x2="70" y2="175" stroke="#5c6bc0" stroke-width="3"/>
  <line x1="70" y1="175" x2="90" y2="150" stroke="#5c6bc0" stroke-width="2"/>
  
  <!-- User satisfaction meter -->
  <path d="M300 150 A30 30 0 0 1 330 120" stroke="#4caf50" stroke-width="3" fill="none"/>
  <circle cx="330" cy="120" r="4" fill="#4caf50"/>
  <text x="340" y="115" font-family="Arial" font-size="14" fill="#4caf50">+</text>
  
  <!-- Connecting elements -->
  <path d="M85 155 C100 140, 110 140, 120 150" stroke="#9575cd" stroke-width="2" stroke-dasharray="3,2" fill="none"/>
  <path d="M280 150 C290 140, 295 145, 300 150" stroke="#9575cd" stroke-width="2" stroke-dasharray="3,2" fill="none"/>
  
  <!-- Title -->
  <text x="200" y="240" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#283593">SaaS UX Specialist</text>
</svg>